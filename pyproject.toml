[project]
name = "nlp-aws-lambda-hosting"
version = "1.0.0"
description = "Run spaCy NLP on AWS Lambda with the model in S3, not in the deployment package"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "flask>=3.0,<4",
    "spacy>=3.7,<4",
    "boto3>=1.34",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "ruff>=0.5",
]
sentry = ["sentry-sdk[flask]>=2.0"]

[project.scripts]
nlp-lambda = "nlp_lambda.cli:main"

[tool.setuptools]
packages = ["nlp_lambda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:nlp_lambda.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "ARG", "RET"]
ignore = [
    # `from __future__ import annotations` makes PEP 604 syntax safe on 3.9.
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
