[project]
name = "nlp-aws-lambda-hosting"
version = "1.0.0"
description = "Run spaCy NLP on AWS Lambda with the model in S3, not in the deployment package"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "flask>=3.1,<4",
    "spacy>=3.8,<3.9",
    "boto3>=1.40",
    "requests>=2.32.4",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "moto[s3]>=5.1",
    "ruff>=0.15",
]
sentry = ["sentry-sdk[flask]>=2.0"]

[project.scripts]
nlp-lambda = "nlp_lambda.cli:main"

[tool.setuptools]
packages = ["nlp_lambda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:nlp_lambda.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "ARG", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
